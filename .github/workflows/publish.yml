# The inherited workflow published to skullbite/gnome-add-to-steam.
# Fork validation and packaging now run in testing-ci.yml; no upstream publishing.
name: Manual package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: zip -r extension.zip schemas/*.gschema.xml add-to-steam.py *.js metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: add-to-steam
          path: extension.zip
